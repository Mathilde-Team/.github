# Workflow RÉUTILISABLE : met à jour (« Update branch ») les PR ouvertes vers
# une branche quand celle-ci avance, et tente de résoudre les conflits SIMPLES
# avec un LLM local (Ollama) si la variable OLLAMA_URL est définie (SOCLE.md §11).
#
# Pourquoi : `dev` est protégée en `strict: true` (SOCLE.md §3), donc chaque
# fusion dans `dev` met toutes les autres PR « en retard ».
#
# Appel depuis un dépôt (.github/workflows/maj-branches.yml) :
#   jobs:
#     maj:
#       uses: Mathilde-Team/.github/.github/workflows/maj-branches-reutilisable.yml@main
#       secrets: inherit
#
# Prérequis (organisation) :
#   - une GitHub App (Contents, Pull requests, Issues : lecture/écriture),
#     installée sur les dépôts ; secrets MAJ_APP_ID et MAJ_APP_CLE_PRIVEE.
#     Un push fait avec GITHUB_TOKEN ne relancerait pas la CI : la PR resterait
#     bloquée sur le check requis « Qualité (…) ».
#   - IA (facultatif) : variables OLLAMA_URL et OLLAMA_MODELE. Le job IA tourne
#     TOUJOURS sur le groupe « maison », seul à voir Ollama sur le réseau local.
#
# La CLI `gh` n'a PAS à être pré-installée sur les runners : elle est installée
# à la volée si absente (version épinglée, somme SHA-256 vérifiée, $RUNNER_TEMP).
name: Mise à jour des branches de PR (réutilisable)

"on":
  workflow_call:
    inputs:
      base:
        description: Branche cible des PR à mettre à jour
        type: string
        default: dev
      etiquette_exclusion:
        description: PR portant cette étiquette ignorées
        type: string
        default: pas-de-maj-auto
    secrets:
      MAJ_APP_ID:
        required: true
      MAJ_APP_CLE_PRIVEE:
        required: true

permissions:
  contents: read

jobs:
  maj:
    name: Mise à jour des PR vers ${{ inputs.base }}
    runs-on: { group: maison, labels: [self-hosted, linux] }
    timeout-minutes: 60
    steps:
      # Panne observée (issue #22) : le runner « ubuntu » (Q35) n'a pas la CLI
      # GitHub → exit 127 dès le premier `gh`. Installée à la volée si
      # absente : version épinglée, somme SHA-256 vérifiée, sous $RUNNER_TEMP
      # (rien d'installé durablement sur la machine).
      - name: Installation de la CLI gh si absente
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            echo "gh déjà présente : $(gh --version | head -1)"
            exit 0
          fi
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::Architecture non gérée : $(uname -m)"; exit 1 ;;
          esac
          ver="2.103.2"
          case "$arch" in
            amd64) somme="62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8" ;;
            arm64) somme="4c3e99a50bd8b181a3fe9d69b25dd978bac768148d88f01507c6b4d1ef61a443" ;;
          esac
          dossier="${RUNNER_TEMP}/gh-cli"
          mkdir -p "$dossier"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_${arch}.tar.gz" -o "${dossier}/gh.tgz"
          echo "${somme}  ${dossier}/gh.tgz" | sha256sum --check || { echo "::error::Somme SHA-256 de gh incorrecte"; exit 1; }
          tar -xzf "${dossier}/gh.tgz" -C "$dossier" --strip-components=1
          "${dossier}/bin/gh" --version
          echo "${dossier}/bin" >> "$GITHUB_PATH"

      - name: Jeton de la GitHub App
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MAJ_APP_ID }}
          private-key: ${{ secrets.MAJ_APP_CLE_PRIVEE }}

      - name: Checkout du dépôt
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: Checkout des scripts du socle
        uses: actions/checkout@v7
        with:
          repository: Mathilde-Team/.github
          ref: main
          path: .socle

      - name: Installation de uv
        if: vars.OLLAMA_URL != ''
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Mise à jour, puis résolution IA des conflits simples
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE: ${{ inputs.base }}
          EXCLUSION: ${{ inputs.etiquette_exclusion }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          OLLAMA_URL: ${{ vars.OLLAMA_URL }}
          OLLAMA_MODELE: ${{ vars.OLLAMA_MODELE || 'qwen2.5-coder:14b' }}
        run: |
          set -uo pipefail
          depot="$GITHUB_REPOSITORY"
          id_bot="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id_bot}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh label create conflit --color B60205 --description "Conflit à résoudre à la main" --force >/dev/null
          gh label create resolu-par-ia --color FBCA04 --description "Conflit résolu par l'IA locale : relire" --force >/dev/null

          gh pr list --base "$BASE" --state open --limit 100 \
            --json number,headRefName,headRefOid,isDraft,isCrossRepository,labels \
            --jq ".[] | select(.isDraft|not) | select(.isCrossRepository|not)
                 | select([.labels[].name] | index(\"$EXCLUSION\") | not)
                 | [.number, .headRefName, .headRefOid, ([.labels[].name] | join(\",\"))] | @tsv" > prs.tsv

          while IFS=$'\t' read -r n tete sha etiquettes; do
            retard="$(gh api "repos/$depot/compare/${sha}...${BASE}" --jq .ahead_by)"
            [ "${retard:-0}" -gt 0 ] || { echo "#$n à jour"; continue; }
            if sortie="$(gh pr update-branch "$n" 2>&1)"; then
              echo "#$n mise à jour ($retard commit(s) de $BASE)"
              case ",$etiquettes," in *,conflit,*) gh pr edit "$n" --remove-label conflit ;; esac
              continue
            fi
            echo "#$n : $sortie"
            case "$sortie" in *onflict*) ;; *) continue ;; esac
            case ",$etiquettes," in *,conflit,*) echo "#$n déjà signalée"; continue ;; esac

            if [ -n "$OLLAMA_URL" ]; then
              git fetch -q origin "$BASE" "$tete"
              git checkout -q -B "$tete" "origin/$tete"
              if git -c merge.conflictStyle=diff3 merge --no-ff --no-edit "origin/$BASE" >/dev/null 2>&1; then
                code=0   # fusion propre côté git (cas rare)
                echo "Fusion sans conflit de contenu." > resume-ia.md
              else
                # `code=0` AVANT l'invocation : si le script réussit, le `||
                # code=$?` n'exécute pas, et `code` resterait indéfini (set -u) ou
                # garderait la valeur d'une PR précédente de la boucle. Le script
                # sort avec 2 PAR CONTRAT (« conflit jugé non simple », cf. sa
                # docstring) : `; code=$?` ne protège pas de `bash -e` (le shell
                # meurt avant l'affectation, issue #25) — `|| code=$?` capture le
                # code sans tuer le job. Seul le code 1 (erreur technique
                # Ollama) reste bloquant, après nettoyage de l'état.
                code=0
                IA_RESUME=resume-ia.md uv run .socle/scripts/resoudre_conflits_ia.py || code=$?
              fi
              if [ "$code" -eq 1 ]; then
                git merge --abort 2>/dev/null || true
                git checkout -q --detach
                echo "::error::resoudre_conflits_ia.py : erreur technique (exit 1) — job bloqué"
                exit 1
              fi
              if [ "$code" -eq 0 ]; then
                git commit -q --no-edit -m "Fusion de $BASE dans $tete (conflits simples résolus par IA locale : $OLLAMA_MODELE)" || true
                if git push -q origin "HEAD:$tete"; then
                  gh pr ready "$n" --undo || true   # brouillon : impossible à fusionner sans relecture
                  gh pr edit "$n" --add-label resolu-par-ia
                  gh pr comment "$n" --body-file resume-ia.md
                  rm -f resume-ia.md; git checkout -q --detach; continue
                fi
              fi
              git merge --abort 2>/dev/null || true
              git checkout -q --detach
            fi
            gh pr edit "$n" --add-label conflit
            { echo "Mise à jour automatique impossible : conflit avec \`$BASE\`."; \
              [ -f resume-ia.md ] && cat resume-ia.md; } > message.md
            gh pr comment "$n" --body-file message.md
            rm -f resume-ia.md message.md
          done < prs.tsv
